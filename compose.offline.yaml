# Use after the images have been built/downloaded once. This network has no Internet route.
services:
  db:
    ports: !reset []
    networks: [offline]
  setup:
    networks: [offline]
  app:
    ports: !reset []
    networks: [offline]
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./infra/offline-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [offline, local_access]
    depends_on:
      - app
    restart: unless-stopped
networks:
  offline:
    internal: true
  local_access:
